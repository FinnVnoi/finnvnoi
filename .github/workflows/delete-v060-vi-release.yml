name: Delete misplaced Vietnamese release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete:
    if: contains(github.event.head_commit.message, '[delete-v060-vi-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v0.60.0-vi'
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
