<svg width="900" height="150" viewBox="0 0 900 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Floating bubbles divider</title>
  <desc id="desc">Animated neon bubbles floating upward on a dark gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#2563eb" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="bubble" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.08"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="150" rx="22" fill="url(#bg)"/>
  <path d="M20 120 C180 70, 300 150, 460 100 S720 80, 880 118" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M40 92 C200 130, 310 54, 480 88 S735 142, 860 70" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="2"/>

  <g filter="url(#glow)">
    <circle cx="80" cy="120" r="9" fill="url(#bubble)">
      <animate attributeName="cy" values="132;28;132" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="165" cy="105" r="5" fill="url(#bubble)">
      <animate attributeName="cy" values="142;34;142" dur="6.5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6.5s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="255" cy="128" r="12" fill="url(#bubble)">
      <animate attributeName="cy" values="144;22;144" dur="9.5s" begin="-3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="9.5s" begin="-3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="118" r="7" fill="url(#bubble)">
      <animate attributeName="cy" values="135;38;135" dur="7.2s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="7.2s" begin="-2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="455" cy="135" r="10" fill="url(#bubble)">
      <animate attributeName="cy" values="146;30;146" dur="10s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="10s" begin="-5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="110" r="6" fill="url(#bubble)">
      <animate attributeName="cy" values="140;26;140" dur="6.8s" begin="-2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6.8s" begin="-2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="124" r="13" fill="url(#bubble)">
      <animate attributeName="cy" values="148;24;148" dur="11s" begin="-6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.72;0" dur="11s" begin="-6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="755" cy="112" r="7" fill="url(#bubble)">
      <animate attributeName="cy" values="138;32;138" dur="7.6s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.82;0" dur="7.6s" begin="-4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="130" r="10" fill="url(#bubble)">
      <animate attributeName="cy" values="145;35;145" dur="8.8s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.78;0" dur="8.8s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="450" y="82" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="18" fill="#e0f2fe" fill-opacity="0.92">
    build • deploy • debug • learn • rebuild better
  </text>
</svg>
